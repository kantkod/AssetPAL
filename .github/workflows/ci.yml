name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci || npm install

      - name: Generate corpus
        run: npm run gen

      - name: Test
        run: npm test

      - name: Build (verifies the Netlify pipeline)
        run: npm run build
